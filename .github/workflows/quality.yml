name: Quality and desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run musical unit tests
        run: |
          npm run test:karaoke
          npm run test:catalog
          npm run test:references
          npm run test:transcription

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Verify offline cache assets
        run: node scripts/verify-offline-assets.mjs

      - name: Build static bundle
        run: node scripts/build-static.mjs

      - name: Run E2E Test Suite
        run: npx playwright test --workers=2 --retries=0

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-results
          path: test-results/
          retention-days: 7
