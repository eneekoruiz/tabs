  <!-- Script de limpieza inmediata de Service Worker y Caché obsoleto -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (let registration of registrations) {
          registration.unregister().then(() => {
            console.log('🧹 [PWA] Service worker antiguo desregistrado.');
          });
        }
      });
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (let name of names) {
            caches.delete(name);
          }
        });
      }
    }
  </script>

<body class="theme-ivory">

  <div class="app-root">
    <!-- 1. Barra de Transporte Superior para Reproductor -->
    <header id="transport-container" style="display: none;"></header>

    <!-- 2. Barra de Metadatos de la Canción Activa -->
    <section class="song-info-strip" id="songInfoStrip" role="region" aria-label="Información de la partitura activa" style="display: none;">
      <div class="song-info-meta">
        <span class="song-info-title" id="songInfoTitle">Tabs & Chords PRO</span>
        <span class="song-info-artist" id="songInfoArtist">— Selecciona una canción</span>
      </div>
      <div class="song-info-details" id="songInfoDetails">
        <span>♩ 120 BPM</span>
        <span>Standard E</span>
      </div>
    </section>

    <!-- 3. Área de Trabajo Principal Mobile-First (Vistas Alternables) -->
    <main class="main-workspace">
      <!-- Vista 1: Explorar / Buscador Gigante -->
      <div id="explore-view-container" class="view-container active-view"></div>

      <!-- Vista 2: Mis Tablaturas & Repertorios -->
      <div id="library-container" class="view-container"></div>

      <!-- Vista 3: Herramientas del Músico (Afinador de Oído & Acordes IA) -->
      <div id="tools-view-container" class="view-container"></div>

      <!-- Vista 4: Ajustes del Músico, Perfil & Cuenta -->
      <div id="settings-view-container" class="view-container"></div>

      <!-- Vista 5: Reproductor Limpio (Letra con Acordes por Defecto + Lienzo Tablatura) -->
      <div class="score-viewport view-container" id="score-viewport" role="region" aria-label="Lienzo de letra y acordes musicales">
        <div id="lyrics-chords-container"></div>
        <div id="alphatab" style="display: none;"></div>
      </div>

      <!-- Overlays y Modales Secundarios (Desactivados por Defecto) -->
      <div id="speedtrainer-container" role="region" aria-label="Speed Trainer"></div>
      <div id="tuner-container" role="region" aria-label="Afinador Cromático"></div>
      <div id="vocal-coach-container" role="region" aria-label="Asistente Vocal"></div>
      <div id="transcription-modal-container" role="region" aria-label="Transcripción de Audio"></div>
      <div id="analytics-modal-container" role="region" aria-label="Panel de Analíticas"></div>
      <div id="stems-modal-container" role="region" aria-label="Separador de Stems"></div>
      <div id="pedalboard-modal-container" role="region" aria-label="Pedalera Virtual"></div>
      <div id="looper-modal-container" role="region" aria-label="Smart Looper"></div>
      <div id="smart-band-modal-container" role="region" aria-label="The Smart Band"></div>
      <div id="arcade-mode-modal-container" role="region" aria-label="Modo Arcade"></div>
      <div id="bandroom-modal-container" role="region" aria-label="BandRoom Multijugador"></div>
      <div id="stage-automation-modal-container" role="region" aria-label="Stage Automation MIDI"></div>
      <div id="spatial-xr-modal-container" role="region" aria-label="Spatial Computing XR HUD"></div>
      <div id="pro-toolbox-container" role="region" aria-label="Arsenal PRO"></div>
      <div id="chord-modal-container" role="region" aria-label="Diccionario de acordes"></div>
      <div id="audio-sync-modal-container" role="region" aria-label="Sincronización de audio"></div>
      <div id="export-modal-container" role="region" aria-label="Exportar partitura"></div>
      <div id="gig-mode-container" role="region" aria-label="Modo Directo"></div>
      <div id="song-importer-container" role="region" aria-label="Importar canción"></div>
    </main>

    <!-- 4. Deck Inferior Secundario (Oculto por Defecto) -->

<script>
  (function() {
    var theme = localStorage.getItem('app_visual_theme');
    if (theme === 'oled') {
      document.body.classList.add('theme-charcoal');
    } else if (theme === 'amber') {
      document.body.classList.add('theme-amber');
    } else {
      // Modo predeterminado: Blanco / Claro (Ivory / Paper)
      document.body.classList.add('theme-ivory');
      if (!theme) localStorage.setItem('app_visual_theme', 'paper');
    }
  })();
</script>
